[build]
  command    = "npm run build"
  publish    = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from   = "http://monctonvotes.ca/*"
  to     = "https://monctonvotes.ca/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.monctonvotes.ca/*"
  to     = "https://monctonvotes.ca/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache hashed assets forever — Vite filenames change when content changes
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the HTML entry point — always fetch fresh so users get new deploys
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
