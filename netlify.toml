[build]
  command    = "npm run build"
  publish    = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from   = "http://monctonvotes.ca/*"
  to     = "https://monctonvotes.ca/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.monctonvotes.ca/*"
  to     = "https://monctonvotes.ca/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.monctonvotes.ca/*"
  to     = "https://monctonvotes.ca/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache hashed assets forever — Vite filenames change when content changes
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages: browsers must revalidate before using cached content (so users always
# get fresh HTML after a deploy), but the Netlify CDN edge can cache for 1 hour.
# Netlify automatically purges the CDN cache on each deploy, so s-maxage is safe.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, must-revalidate"

# Force full response (200) for OG image — prevents Facebook scraper getting 206
[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Accept-Ranges = "none"
    Cache-Control = "public, max-age=86400"
